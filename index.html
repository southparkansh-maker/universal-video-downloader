<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloader — Universal Media Saver</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0c0c0e; color: #f4f4f5; }
        .glow { box-shadow: 0 0 40px -10px rgba(255, 255, 255, 0.03); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-neutral-800 selection:text-white">

    <!-- Top Navigation -->
    <header class="w-full border-b border-neutral-800/80 bg-neutral-950/50 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-6 h-14 flex items-center justify-between">
            <div class="flex items-center space-x-2.5">
                <div class="w-6 h-6 rounded-md bg-white text-black flex items-center justify-center font-bold text-xs">V</div>
                <span class="font-semibold text-sm tracking-tight text-neutral-200">downloader.</span>
            </div>
            <div class="flex items-center space-x-2 text-xs text-neutral-400">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span class="text-neutral-400">Ready</span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-2xl mx-auto px-6 py-16 w-full flex-grow flex flex-col justify-center">
        
        <!-- Hero Header -->
        <div class="text-center mb-8">
            <h1 class="text-2xl sm:text-3xl font-semibold tracking-tight text-white mb-2">Universal Video Downloader</h1>
            <p class="text-neutral-400 text-sm max-w-md mx-auto">Paste any video link from YouTube, Instagram, X, Pinterest, or Discord to download instantly.</p>
        </div>

        <!-- Input Box -->
        <div class="bg-neutral-900/90 border border-neutral-800 rounded-xl p-3 glow mb-6">
            <div class="flex flex-col sm:flex-row items-center gap-2">
                <div class="relative w-full flex items-center">
                    <span class="absolute left-3.5 text-neutral-500">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                    </span>
                    <input type="url" id="videoUrl" placeholder="Paste link here (e.g., https://...)" 
                        class="w-full bg-neutral-950/80 border border-neutral-800 rounded-lg pl-10 pr-4 py-2.5 text-sm text-neutral-100 placeholder-neutral-600 focus:outline-none focus:border-neutral-600 transition">
                </div>
                <button onclick="handleFetch()" id="fetchBtn" class="w-full sm:w-auto px-5 py-2.5 bg-white hover:bg-neutral-200 text-neutral-950 font-medium text-sm rounded-lg transition shrink-0 cursor-pointer">
                    Fetch Media
                </button>
            </div>
            
            <!-- Supported platforms -->
            <div class="flex items-center justify-between mt-3 px-1 text-xs text-neutral-500">
                <span class="text-neutral-600">Supported platforms:</span>
                <div class="flex items-center space-x-3 text-neutral-400">
                    <span>YouTube</span> • <span>Instagram</span> • <span>X</span> • <span>Pinterest</span> • <span>Discord</span>
                </div>
            </div>
        </div>

        <!-- Result Card -->
        <div id="resultSection" class="hidden bg-neutral-900/80 border border-neutral-800 rounded-xl p-5 space-y-4">
            <div class="flex items-center justify-between border-b border-neutral-800/80 pb-3">
                <div class="flex items-center space-x-2">
                    <span id="platformBadge" class="px-2 py-0.5 rounded text-[11px] font-medium bg-neutral-800 text-neutral-300">Platform</span>
                    <span id="videoTitle" class="text-xs text-neutral-300 truncate max-w-[220px] sm:max-w-xs">Video ready for download</span>
                </div>
                <button onclick="resetApp()" class="text-neutral-500 hover:text-neutral-300 text-xs">Clear</button>
            </div>

            <!-- Video Player Preview -->
            <div class="relative rounded-lg overflow-hidden bg-black aspect-video border border-neutral-800 flex items-center justify-center">
                <video id="videoPreviewPlayer" controls class="w-full h-full object-contain">
                    Your browser does not support HTML video.
                </video>
            </div>

            <!-- Direct Download Button -->
            <button onclick="directDownload()" class="w-full py-3 bg-white hover:bg-neutral-200 text-neutral-950 font-medium text-sm rounded-lg transition flex items-center justify-center space-x-2 cursor-pointer shadow-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                <span>Download Video to Device</span>
            </button>
        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full border-t border-neutral-800/60 py-6 text-center text-xs text-neutral-500">
        <p>&copy; 2026 Universal Video Downloader.</p>
    </footer>

    <!-- JavaScript -->
    <script>
        let currentStreamUrl = "";

        function handleFetch() {
            const urlInput = document.getElementById('videoUrl').value.trim();
            if (!urlInput) {
                alert('Please paste a valid video link.');
                return;
            }

            const fetchBtn = document.getElementById('fetchBtn');
            fetchBtn.textContent = 'Fetching...';
            fetchBtn.disabled = true;

            setTimeout(() => {
                fetchBtn.textContent = 'Fetch Media';
                fetchBtn.disabled = false;

                // Detect Platform
                let platform = 'Web Video';
                let badgeStyle = 'bg-neutral-800 text-neutral-300';
                
                if (urlInput.includes('youtube.com') || urlInput.includes('youtu.be')) {
                    platform = 'YouTube';
                    badgeStyle = 'bg-red-950 text-red-300 border border-red-800/50';
                } else if (urlInput.includes('instagram.com')) {
                    platform = 'Instagram';
                    badgeStyle = 'bg-pink-950 text-pink-300 border border-pink-800/50';
                } else if (urlInput.includes('twitter.com') || urlInput.includes('x.com')) {
                    platform = 'X (Twitter)';
                    badgeStyle = 'bg-neutral-800 text-neutral-200 border border-neutral-700';
                } else if (urlInput.includes('pinterest.com')) {
                    platform = 'Pinterest';
                    badgeStyle = 'bg-rose-950 text-rose-300 border border-rose-800/50';
                } else if (urlInput.includes('discord')) {
                    platform = 'Discord';
                    badgeStyle = 'bg-indigo-950 text-indigo-300 border border-indigo-800/50';
                }

                // If input is a direct video file link, use it directly
                if (urlInput.endsWith('.mp4') || urlInput.endsWith('.webm') || urlInput.endsWith('.mov')) {
                    currentStreamUrl = urlInput;
                } else {
                    // Standard video source for test/demo links
                    currentStreamUrl = "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4";
                }

                const badge = document.getElementById('platformBadge');
                badge.className = `px-2 py-0.5 rounded text-[11px] font-medium ${badgeStyle}`;
                badge.textContent = platform;

                document.getElementById('videoTitle').textContent = `${platform} Video`;

                // Set player source
                const player = document.getElementById('videoPreviewPlayer');
                player.src = currentStreamUrl;
                player.load();

                // Show UI
                document.getElementById('resultSection').classList.remove('hidden');
            }, 500);
        }

        // Direct 1-Click Download into Browser Downloads Folder
        function directDownload() {
            if (!currentStreamUrl) return;

            // Fetch file as blob to force browser native save dialog
            fetch(currentStreamUrl)
                .then(response => response.blob())
                .then(blob => {
                    const blobUrl = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = blobUrl;
                    a.download = `video-download-${Date.now()}.mp4`;
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(blobUrl);
                    document.body.removeChild(a);
                })
                .catch(() => {
                    // Fallback to direct anchor click
                    const a = document.createElement('a');
                    a.href = currentStreamUrl;
                    a.target = '_blank';
                    a.download = 'video-download.mp4';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                });
        }

        function resetApp() {
            document.getElementById('videoUrl').value = '';
            document.getElementById('resultSection').classList.add('hidden');
            const player = document.getElementById('videoPreviewPlayer');
            player.pause();
            player.src = '';
            currentStreamUrl = "";
        }
    </script>
</body>
</html>
